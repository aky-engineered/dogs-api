version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dogsdb
    environment:
      MYSQL_DATABASE: dogsdb
      MYSQL_USER: dogsuser
      MYSQL_PASSWORD: dogspass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dogsuser", "-pdogspass"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - dogsdb_data:/var/lib/mysql
volumes:
  dogsdb_data: